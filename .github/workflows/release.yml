name: Release

# GitHub'da bir sürüm (Release) yayınlanınca Windows exe'si derlenir ve sürüme eklenir.
# Elle çalıştırmak için: Actions → Release → Run workflow (sürüm etiketini gir).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Paketleri kur
        run: pip install -r requirements-dev.txt
      - name: Testler
        run: python -m pytest -q
      - name: Exe derle
        run: python build_exe.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/VideoASCIIArtConverter -DestinationPath PixelArtVideo-Windows-x64.zip
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.TAG }}" PixelArtVideo-Windows-x64.zip --clobber
